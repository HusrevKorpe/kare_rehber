<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışı — KARE-Rehber</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .kutu {
        max-width: 420px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: #0f172a;
        color: #fff;
        font-weight: 800;
        font-size: 26px;
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        color: #475569;
        line-height: 1.5;
      }
      button {
        background: #0f172a;
        color: #fff;
        border: 0;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="kutu">
      <div class="logo">K</div>
      <h1>İnternet bağlantısı yok</h1>
      <p>Şu anda çevrimdışı görünüyorsunuz. Bağlantı sağlanınca sayfayı tekrar yükleyebilirsiniz.</p>
      <button onclick="location.reload()">Tekrar dene</button>
    </div>
  </body>
</html>
